name: Firebase security rules

on:
  push:
    paths:
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/firebase-rules.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "firebase/**"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
