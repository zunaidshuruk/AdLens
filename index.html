<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AdLens — Marketing Intelligence Console</title>
    <meta name="description" content="Unified marketing analytics console for Google Analytics 4, Google Search Console, and Meta Ads." />
    <meta property="og:title" content="AdLens — Marketing Intelligence Console" />
    <meta property="og:description" content="Unified marketing analytics console for Google Analytics 4, Google Search Console, and Meta Ads." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1012" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AdLens" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        var raw = localStorage.getItem('adlens_theme_cache');
        if (raw) {
          var cached = JSON.parse(raw);
          var vars = (cached && typeof cached.vars === 'object' && cached.vars) || cached;
          var root = document.documentElement;
          if (vars && typeof vars === 'object') {
            for (var k in vars) {
              if (k.indexOf('--') === 0 && typeof vars[k] === 'string') {
                root.style.setProperty(k, vars[k]);
              }
            }
            if (vars['--root-font-size']) {
              root.style.fontSize = vars['--root-font-size'];
            }
          }
          var mode =
            cached && (cached.mode === 'dark' || cached.mode === 'light')
              ? cached.mode
              : vars && vars['--color-surface'] && vars['--color-surface'] !== '#ffffff'
                ? 'dark'
                : 'light';
          root.classList.toggle('dark', mode === 'dark');
          root.style.colorScheme = mode;
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
